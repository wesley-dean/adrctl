---
# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  workflow_dispatch:

name: Versioning
permissions:
  contents: read

concurrency:
  group: "${{ github.ref }}-${{ github.workflow }}"
  cancel-in-progress: true

jobs:
  versioning:
    runs-on: ubuntu-24.04
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Calculate version
        id: calculate-version
        uses: bitshifted/git-auto-semver@c4e8f005e839f822325356f141939cf6c76b5701 # v1
        with:
          create_tag: false
          initial_version: 0.0.1
          tag_prefix: v

      - name: Generate release notes
        id: release-notes
        uses: RedCrafter07/release-notes-action@31674bfa3a219e7c661fc0c5b7b3851c741b9965 # v1.0.1
        with:
          tag-name: "v${{ steps.calculate-version.outputs.version-string }}"
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Install release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bats curl shellcheck

      - name: Validate maintained source
        run: make check

      - name: Synchronize and verify build dependencies
        run: |
          make deps
          make deps-check

      - name: Build release artifacts and checksums
        run: |
          make build \
            VERSION="${{ steps.calculate-version.outputs.version-string }}"

      - name: Validate exact release artifacts
        env:
          ADR_PAGER: cat
          VISUAL: "true"
        run: |
          for artifact in \
            dist/adrctl.dev.bash \
            dist/adrctl.bash \
            dist/adrctl.min.bash; do
            bash -n "${artifact}"
            test -x "${artifact}"
            ADRCTL_ARTIFACT="${GITHUB_WORKSPACE}/${artifact}" bats tests/*.bats
          done

      - name: Validate exact release artifacts with Bash 4.3
        run: |
          for artifact in \
            dist/adrctl.dev.bash \
            dist/adrctl.bash \
            dist/adrctl.min.bash; do
            docker run --rm \
              --env ADRCTL_ARTIFACT="/work/${artifact}" \
              --volume "${GITHUB_WORKSPACE}:/work:ro" \
              --workdir /work \
              bash:4.3 \
              bash tests/compat-bash43.bash
          done

      - name: Verify checksums
        run: |
          cd dist
          sha256sum -c \
            adrctl.dev.bash.256 \
            adrctl.bash.256 \
            adrctl.min.bash.256

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/adrctl.dev.bash
            dist/adrctl.bash
            dist/adrctl.min.bash
            dist/adrctl.dev.bash.256
            dist/adrctl.bash.256
            dist/adrctl.min.bash.256

      - name: Create release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          name: "v${{ steps.calculate-version.outputs.version-string }}"
          body: "${{ steps.release-notes.outputs.release-notes }}"
          tag_name: "v${{ steps.calculate-version.outputs.version-string }}"
          target_commitish: "${{ github.sha }}"
          draft: false
          prerelease: false
          files: |
            dist/adrctl.dev.bash
            dist/adrctl.bash
            dist/adrctl.min.bash
            dist/adrctl.dev.bash.256
            dist/adrctl.bash.256
            dist/adrctl.min.bash.256
